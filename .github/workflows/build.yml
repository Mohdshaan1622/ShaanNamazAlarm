name: Build Shaan Namaz Alarm APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -q ShaanNamazAlarm_AndroidStudio_Project.zip

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle -p ShaanNamazAlarm assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shaan-Namaz-Alarm-APK
          path: ShaanNamazAlarm/app/build/outputs/apk/debug/app-debug.apk
